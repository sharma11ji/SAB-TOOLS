name: Deploy SAB TOOLS to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_PUSH_OWNER_UID: ${{ secrets.VITE_PUSH_OWNER_UID }}
          VITE_REGISTER_OWNER_UID: ${{ secrets.VITE_REGISTER_OWNER_UID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: update-release-worker
          path: dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-update:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_UPDATE_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: update-release-worker
          path: release
      - name: Send owner update notifications after verifying live release
        run: node scripts/sendUpdatePush.mjs
        env:
          FIREBASE_PUSH_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_PUSH_SERVICE_ACCOUNT }}
          PUSH_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          PUSH_OWNER_UID: ${{ secrets.VITE_PUSH_OWNER_UID }}
          RELEASE_WORKER: release/sw.js
